<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SpectralKey</title>
  <style>
    :root{color-scheme:dark;--bg:#16181c;--panel:#16181c;--line:#16181c;--text:#e8f0ee;--muted:#91a5a5;--lime:#006eff;--amber:#f4b95f;--red:#ff6b67;--cyan:#16181c}
    *{box-sizing:border-box}body{margin:0;background:black,var(--bg);color:var(--text);font:16px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace}button,input,select,textarea{font:inherit}button{cursor:pointer}
    header{display:flex;align-items:end;justify-content:space-between;padding:30px max(24px,4vw) 20px;border-bottom:1px solid var(--line)}h1{margin:0;font-size:clamp(1.5rem,3vw,2.3rem);letter-spacing:-.06em}.eyebrow{color:var(--text);font-size:.78rem;letter-spacing:.16em;text-transform:uppercase}.live{color:var(--text);font-size:.85rem}.live:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--text);box-shadow:0 0 12px var(--lime);margin-right:8px}
    main{max-width:1400px;margin:auto;padding:24px max(24px,4vw) 50px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat,.panel{background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line);border-radius:10px}.stat{padding:17px}.stat b{display:block;font-size:1.7rem;color:var(--text)}.stat span{color:var(--muted);font-size:.78rem;text-transform:uppercase}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.btn{border:1px solid var(--muted);background:#16181c;color:var(--text);border-radius:7px;padding:10px 14px}.btn.primary{background:var(--muted);color:#14200c;border-color:var(--lime);font-weight:700}.btn:hover{filter:brightness(1.15)}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:18px}.panel{overflow:hidden}.panel-title{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}.panel-title h2{font-size:.9rem;margin:0;text-transform:uppercase;letter-spacing:.09em}.filters{display:flex;gap:8px}select,input,textarea{background:#0a1417;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:9px;min-width:0}
    table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;padding:11px 12px;border-bottom:1px solid var(--line)}td{padding:13px 12px;border-bottom:1px solid #1b292d;vertical-align:top}tbody tr{transition:.15s}tbody tr:hover{background:#142226}.freq{color:var(--cyan);font-weight:700;white-space:nowrap}.meta{font-size:.76rem;color:var(--muted);margin-top:3px}.badge{display:inline-block;font-size:.68rem;padding:3px 7px;border-radius:20px;text-transform:uppercase;font-weight:700}.unusual{background:#4a2020;color:#ff9692}.identified{background:#1e4129;color:#a9efaa}.probably_identified{background:#44371d;color:#f4d68a}.unresolved{background:#233947;color:#8bd7f1}.score{font-size:1.1rem;font-weight:700}.empty{text-align:center;color:var(--muted);padding:60px 20px}
    aside{padding:16px}.detail-head{border-bottom:1px solid var(--line);padding-bottom:15px;margin-bottom:15px}.detail-head h2{margin:5px 0;font-size:1.45rem;color:var(--cyan)}dl{display:grid;grid-template-columns:110px 1fr;gap:10px;margin:0 0 18px}dt{color:var(--muted);font-size:.78rem}dd{margin:0;font-size:.85rem;overflow-wrap:anywhere}.reason{border-left:2px solid var(--amber);padding:7px 10px;margin:7px 0;background:#172022;font-size:.78rem}audio{width:100%;height:40px;margin:8px 0 15px}.transcript{background:#081113;border:1px solid var(--line);padding:12px;border-radius:6px;min-height:56px;white-space:pre-wrap;font-size:.82rem}
    dialog{width:min(620px,calc(100% - 30px));background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:0}dialog::backdrop{background:#000b}.modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.modal-head h2{margin:0;font-size:1rem}.form{padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:.76rem;color:var(--muted)}.actions{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px;margin-top:6px}.error{color:var(--red);font-size:.8rem}
    @media(max-width:900px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.table-wrap{overflow:auto}aside{min-height:250px}}@media(max-width:520px){header{align-items:start}.stats{grid-template-columns:1fr 1fr}.stat b{font-size:1.25rem}.form{grid-template-columns:1fr}.field.full{grid-column:auto}th:nth-child(3),td:nth-child(3){display:none}}
  .brand{display:flex;align-items:center;gap:12px}.brand img{object-fit:contain;flex-shrink:0}header{gap:16px}@media(max-width:520px){header{flex-wrap:wrap}}
</style>
</head>
<body>
<header><div><h1 class="brand"><img src="assets/spectralkey-logo.png" alt="" width="68" height="68"><span>SpectralKey</span></h1></div></div></header>
<main>
  <section class="stats"><div class="stat"><b id="total">0</b><span>events captured</span></div><div class="stat"><b id="unusual">0</b><span>unusual signals</span></div><div class="stat"><b id="signatures">0</b><span>unique signatures</span></div><div class="stat"><b id="hours">0m</b><span>recorded duration</span></div></section>
  <div class="toolbar"><button class="btn primary" id="add">+ Log signal</button><button class="btn" id="refresh">Refresh</button></div>
  <div class="layout">
    <section class="panel"><div class="panel-title"><h2>Observation timeline</h2><div class="filters"><select id="filter" aria-label="Filter by classification"><option value="">All classifications</option><option value="unusual">Unusual</option><option value="unresolved">Unresolved</option><option value="identified">Identified</option></select></div></div><div class="table-wrap"><table><thead><tr><th>Frequency</th><th>UTC / receiver</th><th>Mode & evidence</th><th>Assessment</th></tr></thead><tbody id="events"></tbody></table><div class="empty" id="empty">No observations yet. Log a signal or load the demonstration data.</div></div></section>
    <aside class="panel" id="detail"><div class="empty">Select an observation to inspect its evidence.</div></aside>
  </div>
</main>
<dialog id="modal"><div class="modal-head"><h2>Log a signal observation</h2><button class="btn" id="close">Close</button></div><form class="form" id="form">
  <div class="field"><label>Frequency (kHz)</label><input name="frequency_khz" type="number" step=".1" required value="14590"></div>
  <div class="field"><label>Mode</label><select name="mode"><option>UNKNOWN</option><option>AM</option><option>USB</option><option>LSB</option><option>CW</option><option>RTTY</option></select></div>
  <div class="field"><label>Started at (UTC)</label><input name="started_at" type="datetime-local" required></div>
  <div class="field"><label>Ended at (UTC)</label><input name="ended_at" type="datetime-local"></div>
  <div class="field"><label>Receiver</label><input name="receiver_name" value="Manual observation" required></div>
  <div class="field"><label>Receiver location</label><input name="receiver_location" placeholder="e.g. Virginia, USA"></div>
  <div class="field"><label>SNR (dB)</label><input name="snr_db" type="number" step=".1"></div>
  <div class="field"><label>Audio recording (WAV recommended)</label><input name="audio" type="file" accept="audio/*"></div>
  <div class="field full"><label>Decoded text / notes</label><textarea name="decoded_text" rows="3" placeholder="What was heard or decoded?"></textarea></div>
  <div class="field"><label><input name="drifting" type="checkbox"> Carrier was drifting</label></div><div class="field"><label><input name="unusual_bandwidth" type="checkbox"> Unusual bandwidth</label></div>
  <div class="actions"><span class="error" id="error"></span><button type="button" class="btn" id="cancel">Cancel</button><button class="btn primary">Save observation</button></div>
</form></dialog>
<script>
let data=[]; const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const niceTime=s=>s?new Date(s).toLocaleString(undefined,{timeZone:'UTC',month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false})+' UTC':'—';
async function load(){const [events,stats]=await Promise.all([fetch('/api/events').then(r=>r.json()),fetch('/api/stats').then(r=>r.json())]);data=events;$('#total').textContent=stats.total||0;$('#unusual').textContent=stats.unusual||0;$('#signatures').textContent=stats.signatures||0;$('#hours').textContent=stats.seconds>=3600?(stats.seconds/3600).toFixed(1)+'h':Math.round(stats.seconds/60)+'m';render();}
function render(){const filtered=data.filter(e=>!$('#filter').value||e.classification===$('#filter').value);$('#empty').style.display=filtered.length?'none':'block';$('#events').innerHTML=filtered.map(e=>`<tr data-id="${e.id}" tabindex="0"><td><div class="freq">${e.frequency_khz.toFixed(1)} kHz</div><div class="meta">${e.bandwidth_hz?e.bandwidth_hz+' Hz wide':''}</div></td><td>${niceTime(e.started_at)}<div class="meta">${esc(e.receiver_name)} · ${esc(e.receiver_location||'location unknown')}</div></td><td>${esc(e.mode)} · SNR ${e.snr_db??'—'} dB<div class="meta">${e.occurrences} occurrence${e.occurrences==1?'':'s'}</div></td><td><span class="badge ${e.classification}">${e.classification.replace('_',' ')}</span><div class="meta score">${e.anomaly_score>0?'+':''}${e.anomaly_score}</div></td></tr>`).join('');document.querySelectorAll('tbody tr').forEach(r=>{r.onclick=()=>show(+r.dataset.id);r.onkeydown=e=>{if(e.key==='Enter')show(+r.dataset.id)}})}
function show(id){const e=data.find(x=>x.id===id);if(!e)return;$('#detail').innerHTML=`<div class="detail-head"><span class="badge ${e.classification}">${e.classification.replace('_',' ')}</span><h2>${e.frequency_khz.toFixed(1)} kHz</h2><div class="meta">Signal event #${e.id} · score ${e.anomaly_score>0?'+':''}${e.anomaly_score}</div></div><dl><dt>Observed</dt><dd>${niceTime(e.started_at)}<br>to ${niceTime(e.ended_at)}</dd><dt>Receiver</dt><dd>${esc(e.receiver_name)}<br>${esc(e.receiver_location||'Unknown location')}</dd><dt>Mode / SNR</dt><dd>${esc(e.mode)} / ${e.snr_db??'—'} dB</dd><dt>Schedule match</dt><dd>${esc(e.match_station||'None')} ${e.match_confidence?`(${Math.round(e.match_confidence*100)}%)`:''}</dd><dt>Occurrences</dt><dd>${e.occurrences}</dd><dt>Fingerprint</dt><dd>${esc(e.fingerprint)}</dd></dl>${e.recording_path?`<audio controls src="/${encodeURI(e.recording_path)}"></audio>`:'<div class="meta">No recording attached</div>'}<h3>Assessment evidence</h3>${e.anomaly_reasons.map(x=>`<div class="reason">${esc(x)}</div>`).join('')}<h3>Decoded text / notes</h3><div class="transcript">${esc(e.decoded_text||'No transcript')}</div><button class="btn" style="margin-top:14px" onclick="setReviewed(${e.id})">Mark reviewed</button>`;}
async function setReviewed(id){await fetch(`/api/events/${id}/status`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{"status":"reviewed"}'});await load();show(id)}
$('#filter').onchange=render;$('#refresh').onclick=load;$('#demo').onclick=async()=>{await fetch('/api/demo',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});await load()};
const modal=$('#modal');$('#add').onclick=()=>{const n=new Date();n.setMinutes(n.getMinutes()-n.getTimezoneOffset());document.querySelector('[name=started_at]').value=n.toISOString().slice(0,16);modal.showModal()};$('#close').onclick=$('#cancel').onclick=()=>modal.close();
const file64=file=>new Promise((ok,no)=>{if(!file)return ok('');const r=new FileReader;r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(file)});
$('#form').onsubmit=async ev=>{ev.preventDefault();$('#error').textContent='';try{const f=new FormData(ev.target),audio=f.get('audio');const payload={frequency_khz:+f.get('frequency_khz'),mode:f.get('mode'),started_at:f.get('started_at')+':00Z',ended_at:f.get('ended_at')?f.get('ended_at')+':00Z':null,receiver_name:f.get('receiver_name'),receiver_location:f.get('receiver_location'),snr_db:f.get('snr_db')?+f.get('snr_db'):null,decoded_text:f.get('decoded_text'),drifting:f.has('drifting'),unusual_bandwidth:f.has('unusual_bandwidth'),audio_data:await file64(audio&&audio.size?audio:null)};const r=await fetch('/api/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const out=await r.json();if(!r.ok)throw Error(out.error||'Save failed');modal.close();ev.target.reset();await load();show(out.id)}catch(e){$('#error').textContent=e.message}};
load().catch(e=>{$('#empty').textContent='Cannot reach the Python server: '+e.message});
</script></body></html>
